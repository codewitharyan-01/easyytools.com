<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm Clock | Online Alarm - SwiftUtils</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav><a href="index.html" class="logo">SwiftUtils</a></nav>

    <div class="container">
        <div class="tool-container">
            <div class="tool-header">
                <h2>Alarm Clock</h2>
                <p class="subtitle" id="current-time">00:00:00</p>
            </div>

            <div class="form-group">
                <label>Set Alarm Time</label>
                <input type="time" id="alarm-time">
            </div>

            <button class="btn" onclick="setAlarm()">Set Alarm</button>

            <div id="alarm-status" style="margin-top: 2rem; text-align: center; color: var(--text-muted);">
                No alarm set.
            </div>
        </div>
    </div>

    <!-- Hidden audio element for alarm sound -->
    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" loop></audio>

    <script>
        let alarmTime = null;
        let alarmTimeout = null;

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            document.getElementById('current-time').innerText = timeStr;

            if (alarmTime && now.getHours() === alarmTime.hours && now.getMinutes() === alarmTime.minutes) {
                triggerAlarm();
            }
        }

        setInterval(updateClock, 1000);

        function setAlarm() {
            const input = document.getElementById('alarm-time').value;
            if (!input) {
                alert("Please select a time.");
                return;
            }

            const [hours, minutes] = input.split(':').map(Number);
            alarmTime = { hours, minutes };
            document.getElementById('alarm-status').innerText = `Alarm set for ${input}`;
            document.getElementById('alarm-status').style.color = "var(--text)";
        }

        function triggerAlarm() {
            const sound = document.getElementById('alarm-sound');
            sound.play();
            alarmTime = null; // Reset
            document.getElementById('alarm-status').innerHTML = `
                <div style="color: red; font-weight: 600; margin-bottom: 1rem;">ALARM RINGING!</div>
                <button class="btn" onclick="stopAlarm()">Stop</button>
            `;
        }

        function stopAlarm() {
            const sound = document.getElementById('alarm-sound');
            sound.pause();
            sound.currentTime = 0;
            document.getElementById('alarm-status').innerText = "No alarm set.";
            document.getElementById('alarm-status').style.color = "var(--text-muted)";
        }
    </script>
</body>
</html>
