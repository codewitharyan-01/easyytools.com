<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter | Online Conversion - SwiftUtils</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav><a href="index.html" class="logo">SwiftUtils</a></nav>

    <div class="container">
        <div class="tool-container">
            <div class="tool-header">
                <h2>Unit Converter</h2>
                <p class="subtitle">Quick length conversion.</p>
            </div>

            <div class="form-group">
                <label>From (Meters)</label>
                <input type="number" id="meters" placeholder="Enter value..." oninput="convert()">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="result-box" style="padding: 1rem;">
                    <div class="result-val" id="feet" style="font-size: 1.2rem;">0</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted);">Feet</div>
                </div>
                <div class="result-box" style="padding: 1rem;">
                    <div class="result-val" id="inches" style="font-size: 1.2rem;">0</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted);">Inches</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function convert() {
            const m = parseFloat(document.getElementById('meters').value) || 0;
            document.getElementById('feet').innerText = (m * 3.28084).toFixed(2);
            document.getElementById('inches').innerText = (m * 39.3701).toFixed(2);
        }
    </script>
</body>
</html>
